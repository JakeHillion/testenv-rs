name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Nix format and flake check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main

      - name: Check Nix formatting
        run: nix fmt

      - name: Run Nix flake check
        run: nix flake check

